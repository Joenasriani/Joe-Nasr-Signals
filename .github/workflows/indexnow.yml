name: Notify IndexNow

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "identity.json"
      - "llms.txt"
      - "projects.json"
      - "data/**"
      - "games/itchio/**"
      - "robots.txt"
      - "games.html"
      - "games.json"
      - "games-development.html"
      - "games-development.json"
      - "games-preview.png"
      - "games-preview.svg"
      - "games-development-preview.png"
      - "games-development-preview.svg"
      - "pre-institutional-human-order.html"
      - "sitemap.xml"
      - "publications/**"
      - "certifications/**"
      - "interactive-projects/**"
      - "video-campaigns/**"
      - "music/**"

permissions:
  contents: read

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Build changed public URL list
        id: urls
        shell: bash
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          current="${{ github.sha }}"
          if [[ "$before" =~ ^0+$ ]]; then
            changed="$(git show --pretty='' --name-only "$current")"
          else
            changed="$(git diff --name-only "$before" "$current")"
          fi

          urls=()
          add_url() {
            local u="$1"
            for existing in "${urls[@]:-}"; do
              [[ "$existing" == "$u" ]] && return
            done
            urls+=("$u")
          }

          while IFS= read -r file; do
            case "$file" in
              index.html|sitemap.xml|robots.txt)
                add_url "https://joe-nasr-signals.vercel.app/"
                ;;
              identity.json|llms.txt|projects.json|data/*)
                add_url "https://joe-nasr-signals.vercel.app/$file"
                add_url "https://joe-nasr-signals.vercel.app/"
                ;;
              games/itchio/*)
                add_url "https://joe-nasr-signals.vercel.app/interactive-projects/"
                ;;
              games.html|games.json|games-preview.png|games-preview.svg)
                add_url "https://joe-nasr-signals.vercel.app/games.json"
                add_url "https://joe-nasr-signals.vercel.app/games.html"
                ;;
              games-development.html|games-development.json|games-development-preview.png|games-development-preview.svg)
                add_url "https://joe-nasr-signals.vercel.app/games-development.json"
                add_url "https://joe-nasr-signals.vercel.app/interactive-projects/"
                ;;
              publications/*)
                add_url "https://joe-nasr-signals.vercel.app/publications/"
                ;;
              certifications/*)
                add_url "https://joe-nasr-signals.vercel.app/certifications/"
                ;;
              interactive-projects/*)
                add_url "https://joe-nasr-signals.vercel.app/interactive-projects/"
                ;;
              video-campaigns/*)
                add_url "https://joe-nasr-signals.vercel.app/video-campaigns/"
                ;;
              music/*)
                add_url "https://joe-nasr-signals.vercel.app/music/"
                ;;
              pre-institutional-human-order.html)
                add_url "https://joe-nasr-signals.vercel.app/pre-institutional-human-order.html"
                ;;
            esac
          done <<< "$changed"

          if [[ ${#urls[@]} -eq 0 ]]; then
            echo "payload=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          json_urls="$(printf '%s\n' "${urls[@]}" | jq -R . | jq -s .)"
          payload="$(jq -nc             --arg host "joe-nasr-signals.vercel.app"             --arg key "4f2a8c9d71b64e35a0f3c8d92e7b1a56"             --arg keyLocation "https://joe-nasr-signals.vercel.app/4f2a8c9d71b64e35a0f3c8d92e7b1a56.txt"             --argjson urlList "$json_urls"             '{host:$host,key:$key,keyLocation:$keyLocation,urlList:$urlList}')"

          echo "payload=$payload" >> "$GITHUB_OUTPUT"

      - name: Wait for this publication and permanent routes
        if: steps.urls.outputs.payload != ''
        run: python scripts/wait_for_publication.py

      - name: Submit changed URLs to IndexNow
        if: steps.urls.outputs.payload != ''
        env:
          PAYLOAD: ${{ steps.urls.outputs.payload }}
        run: |
          curl --fail-with-body --retry 3 \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$PAYLOAD" \
            "https://api.indexnow.org/indexnow"
