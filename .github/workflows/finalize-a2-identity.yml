name: Finalize A2 identity
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-a2-identity.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align canonical Person references
        shell: python
        run: |
          from pathlib import Path
          p = Path('pre-institutional-human-order.html')
          s = p.read_text()
          s = s.replace('<link rel="author" href="https://joe-nasr-signals.vercel.app/" />', '<link rel="author" href="https://joe-nasr-signals.vercel.app/v2/" />')
          old = '''    "author": {\n      "@type": "Person",\n      "name": "Joe Nasr",\n      "url": "https://joe-nasr-signals.vercel.app/",\n      "sameAs": [\n        "https://github.com/Joenasriani"\n      ]\n    },'''
          new = '''    "author": {\n      "@type": "Person",\n      "@id": "https://joe-nasr-signals.vercel.app/v2/#joe-nasr",\n      "name": "Joe Nasr",\n      "alternateName": ["Joe Ribal Nasr", "Joseph Ribal Nasr"],\n      "url": "https://joe-nasr-signals.vercel.app/v2/",\n      "sameAs": [\n        "https://github.com/Joenasriani",\n        "https://www.linkedin.com/in/joenasrprofile",\n        "https://linktr.ee/joenasr"\n      ]\n    },'''
          if old not in s:
              raise SystemExit('expected author block not found')
          p.write_text(s.replace(old, new))

          p = Path('v2/index.html')
          s = p.read_text().replace('https://ae.linkedin.com/in/joenasrprofile', 'https://www.linkedin.com/in/joenasrprofile')
          s = s.replace('https://www.youtube.com/c/joenasr', 'https://www.youtube.com/@joenasr')
          p.write_text(s)
      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-a2-identity.yml
          git add pre-institutional-human-order.html v2/index.html
          git commit -m "Align Signals pages with canonical Joe Nasr identity"
          git push
