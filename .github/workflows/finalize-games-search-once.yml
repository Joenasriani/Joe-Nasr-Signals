name: Finalize games search signals

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-games-search-once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Finalize game-centered metadata
        shell: python
        run: |
          import json, re
          from pathlib import Path

          person_id = "https://joe-nasr-signals.vercel.app/v2/#joe-nasr"
          person_url = "https://joe-nasr-signals.vercel.app/v2/"
          games_url = "https://joe-nasr-signals.vercel.app/v2/games.html"

          data_path = Path("v2/games.json")
          catalog = json.loads(data_path.read_text(encoding="utf-8"))

          # Clarify branded/inspired titles so machines do not infer official affiliation.
          clarifications = {
              "GIBBERLINK ACADEMY": "Independent educational browser game inspired by GibberLink-style machine communication, presented as an interactive learning challenge; not an official GibberLink project.",
              "Mario Merge": "Unofficial Mario-themed browser merge puzzle using physics-driven object combinations; not an official Nintendo or Mario product.",
              "ZIP IT!": "Independent LinkedIn-themed browser snake puzzle and compact arcade experiment; not affiliated with LinkedIn.",
              "Cybertruck Madness '98": "Independent browser racing game with a Cybertruck-inspired vehicle in a retro off-road physics format; not an official Tesla product."
          }

          for entry in catalog.get("itemListElement", []):
              item = entry.get("item", {})
              name = item.get("name")
              if name in clarifications:
                  item["description"] = clarifications[name]
              item["creator"] = {
                  "@type": "Person",
                  "@id": person_id,
                  "name": "Joe Nasr",
                  "url": person_url
              }
              item.setdefault("inLanguage", "en")

          data_path.write_text(json.dumps(catalog, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          html_path = Path("v2/games.html")
          html = html_path.read_text(encoding="utf-8")

          # Keep the Games surface about the games. Identity portrait belongs to the creator block and identity page,
          # not to the catalog's social preview metadata.
          html = re.sub(r'\n?<meta property="og:image"[^>]*>', '', html, flags=re.I)
          html = re.sub(r'\n?<meta name="twitter:image"[^>]*>', '', html, flags=re.I)
          if 'rel="author"' not in html:
              html = html.replace(
                  '<link rel="canonical" href="https://joe-nasr-signals.vercel.app/v2/games.html">',
                  '<link rel="canonical" href="https://joe-nasr-signals.vercel.app/v2/games.html">\n<link rel="author" href="https://joe-nasr-signals.vercel.app/v2/">',
                  1,
              )

          graph = {
              "@context": "https://schema.org",
              "@graph": [
                  {
                      "@type": "CollectionPage",
                      "@id": games_url + "#page",
                      "url": games_url,
                      "name": "Games by Joe Nasr",
                      "description": "Canonical catalog of browser, puzzle, XR, educational and experimental games created by Joe Nasr, organized by mechanics, genre, platform and playable surface.",
                      "mainEntity": {"@id": games_url + "#games"},
                      "author": {"@id": person_id},
                      "isPartOf": {"@id": person_url + "#website"},
                      "inLanguage": "en"
                  },
                  {
                      "@type": "Person",
                      "@id": person_id,
                      "name": "Joe Nasr",
                      "alternateName": ["Joe Ribal Nasr", "Joseph Ribal Nasr"],
                      "url": person_url,
                      "image": "https://avatars.githubusercontent.com/u/3828735?v=4",
                      "sameAs": ["https://github.com/Joenasriani", "https://joenasr.itch.io/"]
                  },
                  catalog
              ]
          }

          script = '<script type="application/ld+json">\n' + json.dumps(graph, ensure_ascii=False, indent=2) + '\n</script>'
          html, count = re.subn(
              r'<script type="application/ld\+json">.*?</script>',
              script,
              html,
              count=1,
              flags=re.I | re.S,
          )
          if count != 1:
              raise SystemExit("Expected one JSON-LD block in v2/games.html")

          html_path.write_text(html, encoding="utf-8")

      - name: Remove one-time workflow and commit
        run: |
          rm -f .github/workflows/finalize-games-search-once.yml
          git config user.name "Joe Nasr repository maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add v2/games.html v2/games.json .github/workflows/finalize-games-search-once.yml
          git diff --cached --quiet || git commit -m "Finalize game-centered search and AI metadata"
          git push
