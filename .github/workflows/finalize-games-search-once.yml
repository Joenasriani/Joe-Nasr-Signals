name: Finalize games search and identity alignment

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-games-search-once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Normalize game entities and creator relationship
        shell: python
        run: |
          from pathlib import Path
          import json
          import re

          person_id = "https://joe-nasr-signals.vercel.app/v2/#joe-nasr"
          person_url = "https://joe-nasr-signals.vercel.app/v2/"
          games_url = "https://joe-nasr-signals.vercel.app/v2/games.html"
          preview_url = "https://joe-nasr-signals.vercel.app/v2/games-preview.svg"

          updates = {
            "Pathway": {
              "alternateName": "Pathway: Rotate. Reflect. Light.",
              "description": "Browser laser reflection puzzle game with thirty levels built around rotating glass lenses, redirecting a beam and aligning reflections to illuminate the target.",
              "keywords": ["laser reflection puzzle game", "browser puzzle game", "logic game", "HTML5 game"]
            },
            "DIORAMA": {
              "description": "3D browser mechanical puzzle game built around compact isometric structures, route logic, switches, bridges, lifts and spatial planning.",
              "keywords": ["3D puzzle game", "mechanical puzzle game", "isometric browser game", "spatial reasoning game"]
            },
            "Happy Collector: Good Habits Adventure": {
              "description": "3D browser platform game about collecting good habits, avoiding bad habits and navigating moving floating island obstacles.",
              "keywords": ["3D platform game", "educational browser game", "kids platformer", "good habits game"]
            },
            "Cosmic Velocity: Gyro Control": {
              "description": "Mobile browser 3D space shooter game using phone tilt and gyroscope steering to dodge hazards, shoot targets and collect rings.",
              "keywords": ["mobile browser game", "gyro control game", "space shooter game", "arcade game"]
            },
            "Cheese Maze Mouse": {
              "description": "Browser maze puzzle game with thirty levels, one valid path per level and touch or drag controls for guiding a mouse to the cheese.",
              "keywords": ["maze puzzle game", "mouse game", "browser puzzle game", "logic game"]
            },
            "RoboSim": {
              "description": "Educational browser robot programming game about sequencing commands, simulating robot behavior, testing logic and debugging solutions.",
              "keywords": ["robot programming game", "educational simulation game", "STEM game", "browser robotics game"]
            },
            "Legocraft": {
              "description": "Independent browser based 3D brick building sandbox for placing and editing digital bricks, saving builds, exporting GLB models and exploring creations through WebXR. Not affiliated with the LEGO Group.",
              "keywords": ["3D building game", "sandbox game", "WebXR game", "browser construction game"]
            },
            "AR Tetris": {
              "description": "Independent browser augmented reality falling block puzzle for mobile and Meta Quest browsers using WebXR spatial placement. Not affiliated with Tetris Holding or The Tetris Company.",
              "keywords": ["augmented reality game", "falling block puzzle game", "WebXR game", "Meta Quest browser game"]
            },
            "Cheese Heist Mouse": {
              "description": "Casual browser arcade game about guiding a mouse through a kitchen, collecting cheese and avoiding a suspicious cat.",
              "keywords": ["casual browser game", "mouse game", "collection game", "arcade game"]
            },
            "In a Stickman's World": {
              "description": "Minimalist browser action platform game centered on running, jumping, fighting enemies, avoiding hazards, collecting rings and progressing through levels.",
              "keywords": ["stickman platform game", "browser platformer", "action game", "HTML5 game"]
            },
            "Hand Drone XS": {
              "description": "Browser drone arcade game that uses webcam hand tracking as the control surface for steering, collecting rings and avoiding obstacles.",
              "keywords": ["hand tracking game", "webcam game", "drone arcade game", "motion control game"]
            },
            "Ball Sort 3D": {
              "description": "3D browser color sorting logic puzzle about moving balls between tubes under constrained placement rules.",
              "keywords": ["ball sort puzzle", "color sorting game", "3D puzzle game", "browser logic game"]
            },
            "Routing Protocol": {
              "description": "Browser networking puzzle game about constructing valid packet routes from a source node to a destination server through a constrained grid.",
              "keywords": ["network routing puzzle game", "logic game", "browser networking game", "packet routing puzzle"]
            },
            "GIBBERLINK ACADEMY": {
              "description": "Independent educational browser game inspired by GibberLink style machine communication concepts, with signal decoding, pattern recognition and translation challenges. Not an official GibberLink project.",
              "keywords": ["educational AI communication game", "signal decoding game", "pattern recognition game", "browser learning game"]
            },
            "Coloring Book For Kids": {
              "description": "Touch friendly browser coloring game for children built around drawing, color selection and simple creative interaction.",
              "keywords": ["kids coloring game", "browser drawing game", "creative game", "touch game"]
            },
            "Klotski": {
              "description": "3D browser adaptation of the classic Klotski and Hua Rong Dao sliding block puzzle focused on constrained movement and spatial planning.",
              "keywords": ["Klotski game", "sliding block puzzle", "Hua Rong Dao game", "3D puzzle game"]
            },
            "Mario Merge": {
              "description": "Unofficial Mario themed browser merge puzzle using physics driven object combinations. Not affiliated with Nintendo or the official Mario franchise.",
              "keywords": ["merge puzzle game", "physics merge game", "browser puzzle game", "unofficial fan game"]
            },
            "Old Bounce": {
              "description": "Independent browser platform game centered on compact movement, jumping and touch friendly arcade controls.",
              "keywords": ["browser platform game", "arcade platformer", "touch game", "HTML5 game"]
            },
            "Sector Glow: Cyber-Extract": {
              "description": "Cyber themed browser path puzzle about clearing and extracting a valid route through a glowing grid.",
              "keywords": ["cyber puzzle game", "path puzzle game", "browser logic game", "grid puzzle"]
            },
            "Ascension": {
              "description": "Isometric architectural browser puzzle game built around spatial routes, geometric progression and compact level structures.",
              "keywords": ["isometric puzzle game", "architectural puzzle game", "browser game", "spatial puzzle"]
            },
            "Paradigm Shift": {
              "description": "Browser perspective puzzle game in which changing viewpoint reveals hidden patterns, routes and spatial relationships.",
              "keywords": ["perspective puzzle game", "browser puzzle game", "spatial reasoning game", "logic game"]
            },
            "ZIP IT!": {
              "description": "Independent LinkedIn themed browser snake puzzle and compact arcade game. Not affiliated with LinkedIn.",
              "keywords": ["snake puzzle game", "browser arcade game", "LinkedIn themed game", "indie browser game"]
            },
            "Quantum Entanglement": {
              "description": "Browser dual control puzzle game in which two linked particles must be guided simultaneously to separate target zones.",
              "keywords": ["dual control puzzle game", "browser puzzle game", "coordination game", "logic game"]
            },
            "Cybertruck Madness '98": {
              "description": "Independent retro browser racing game with a Cybertruck inspired vehicle and off road physics. Not affiliated with Tesla.",
              "keywords": ["browser racing game", "retro racing game", "off road physics game", "unofficial fan game"]
            },
            "Tic Tac Toe Reimagined": {
              "description": "Browser board puzzle game that expands the familiar tic tac toe rule set into a larger spatial strategy challenge.",
              "keywords": ["tic tac toe variant", "board puzzle game", "browser strategy game", "logic game"]
            },
            "Jumpy Jumperson": {
              "description": "One button 3D browser runner game built around jumping, mid air boosts, shields and escalating arcade speed.",
              "keywords": ["3D runner game", "one button game", "browser arcade game", "runner game"]
            }
          }

          data_path = Path("v2/games.json")
          original_data = json.loads(data_path.read_text(encoding="utf-8"))
          if "@graph" in original_data:
            graph = original_data["@graph"]
            item_list = next(node for node in graph if node.get("@type") == "ItemList")
          else:
            item_list = original_data

          for row in item_list["itemListElement"]:
            item = row["item"]
            name = item["name"]
            if name not in updates:
              raise SystemExit(f"Missing game normalization rule: {name}")
            old_description = item.get("description", "")
            patch = updates[name]
            item.update(patch)
            item["creator"] = {"@id": person_id}
            item["inLanguage"] = "en"
            item["mainEntityOfPage"] = item.get("url")
            item["_previous_description"] = old_description

          collection = {
            "@type": "CollectionPage",
            "@id": games_url + "#page",
            "url": games_url,
            "name": "Games by Joe Nasr",
            "description": "Canonical catalog of original browser, puzzle, arcade, educational, mobile and WebXR games created by Joe Nasr, organized around gameplay mechanics, genre, platform and official play pages.",
            "image": preview_url,
            "mainEntity": {"@id": games_url + "#games"},
            "about": {"@type": "Thing", "name": "Video games"},
            "author": {"@id": person_id},
            "isPartOf": {"@id": person_url + "#website"},
            "inLanguage": "en",
            "dateModified": "2026-09-16"
          }
          person = {
            "@type": "Person",
            "@id": person_id,
            "name": "Joe Nasr",
            "alternateName": ["Joe Ribal Nasr", "Joseph Ribal Nasr"],
            "url": person_url,
            "image": "https://avatars.githubusercontent.com/u/3828735?v=4",
            "sameAs": ["https://github.com/Joenasriani", "https://joenasr.itch.io/"]
          }
          for row in item_list["itemListElement"]:
            row["item"].pop("_previous_description", None)
          item_list["@id"] = games_url + "#games"
          item_list["name"] = "Joe Nasr Games"
          item_list["description"] = "Original browser, puzzle, arcade, educational, mobile and WebXR games created by Joe Nasr."
          item_list["url"] = games_url
          item_list["numberOfItems"] = len(item_list["itemListElement"])
          item_list["itemListOrder"] = "https://schema.org/ItemListUnordered"
          item_list["image"] = preview_url
          item_list.pop("author", None)

          graph_data = {"@context": "https://schema.org", "@graph": [collection, person, item_list]}
          data_path.write_text(json.dumps(graph_data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          preview = '''<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
          <title id="title">Joe Nasr Games</title>
          <desc id="desc">Editorial catalog image for twenty six public game lineages by Joe Nasr.</desc>
          <rect width="1200" height="630" fill="#f2efe7"/>
          <rect width="1200" height="14" fill="#d9ff4f"/>
          <rect x="60" y="64" width="1080" height="1" fill="#101317" opacity=".3"/>
          <text x="60" y="118" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="800" letter-spacing="4" fill="#101317">JOE NASR / GAMES</text>
          <text x="60" y="230" font-family="Arial,Helvetica,sans-serif" font-size="92" font-weight="900" letter-spacing="-5" fill="#101317">26 PUBLIC</text>
          <text x="60" y="318" font-family="Arial,Helvetica,sans-serif" font-size="92" font-weight="900" letter-spacing="-5" fill="#101317">GAME LINEAGES</text>
          <text x="64" y="374" font-family="Courier New,monospace" font-size="17" font-weight="700" letter-spacing="2" fill="#6c6b66">PUZZLE / ARCADE / WEBXR / PLATFORMER / EDUCATIONAL / SANDBOX</text>
          <rect x="60" y="414" width="1080" height="1" fill="#101317" opacity=".24"/>
          <text x="60" y="455" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#101317">Pathway / DIORAMA / Legocraft / Hand Drone XS / AR Tetris / RoboSim / Ascension</text>
          <text x="60" y="488" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#101317">Paradigm Shift / Quantum Entanglement / Routing Protocol / Ball Sort 3D / Klotski / ZIP IT!</text>
          <text x="60" y="521" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#101317">Happy Collector / Cosmic Velocity / Cheese Maze Mouse / Cheese Heist Mouse / Sector Glow</text>
          <text x="60" y="554" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#101317">In a Stickman's World / Jumpy Jumperson / Tic Tac Toe Reimagined / Old Bounce / Coloring Book</text>
          <rect x="60" y="584" width="1080" height="1" fill="#101317" opacity=".24"/>
          <text x="60" y="612" font-family="Courier New,monospace" font-size="13" font-weight="700" fill="#6c6b66">joe-nasr-signals.vercel.app/v2/games.html</text>
          </svg>'''
          Path("v2/games-preview.svg").write_text(preview, encoding="utf-8")

          html_path = Path("v2/games.html")
          html = html_path.read_text(encoding="utf-8")
          html = re.sub(r'<title>.*?</title>', '<title>Games by Joe Nasr | Browser, Puzzle, Arcade and WebXR Games</title>', html, count=1, flags=re.S)
          html = re.sub(r'<meta name="description" content="[^"]*">', '<meta name="description" content="Original browser, puzzle, arcade, educational, mobile and WebXR games created by Joe Nasr, with gameplay mechanics, official play pages and source provenance.">', html, count=1)
          html = re.sub(r'<meta property="og:description" content="[^"]*">', '<meta property="og:description" content="Original browser, puzzle, arcade, educational, mobile and WebXR games organized by gameplay mechanic, genre and official play surface.">', html, count=1)
          html = re.sub(r'<meta name="twitter:card" content="[^"]*">', '<meta name="twitter:card" content="summary_large_image">', html, count=1)
          html = re.sub(r'<meta name="twitter:description" content="[^"]*">', '<meta name="twitter:description" content="Original browser, puzzle, arcade, educational, mobile and WebXR games created by Joe Nasr.">', html, count=1)
          if 'property="og:image"' not in html:
            anchor = '<meta property="og:url" content="https://joe-nasr-signals.vercel.app/v2/games.html">'
            html = html.replace(anchor, anchor + '\n<meta property="og:image" content="' + preview_url + '">\n<meta property="og:image:alt" content="Joe Nasr Games catalog">', 1)
          if 'name="twitter:image"' not in html:
            anchor = '<meta name="twitter:description" content="Original browser, puzzle, arcade, educational, mobile and WebXR games created by Joe Nasr.">'
            html = html.replace(anchor, anchor + '\n<meta name="twitter:image" content="' + preview_url + '">\n<meta name="twitter:image:alt" content="Joe Nasr Games catalog">', 1)

          script_match = re.search(r'<script type="application/ld\+json">\s*\{.*?\}\s*</script>', html, flags=re.S)
          if not script_match:
            raise SystemExit("Games page JSON LD block not found")
          replacement = '<script type="application/ld+json">\n' + json.dumps(graph_data, indent=2, ensure_ascii=False) + '\n</script>'
          html = html[:script_match.start()] + replacement + html[script_match.end():]

          for row in item_list["itemListElement"]:
            item = row["item"]
            name = item["name"]
            new_description = item["description"]
            # Replace the visible description associated with this game when the prior machine description is present.
            # This keeps rendered text and structured data aligned without changing layout.
            for old in [
              "Thirty-level WebGL light puzzle about rotating glass lenses, redirecting a beam and aligning reflections to illuminate the target.",
              "Early-access isometric route puzzle built around compact spatial scenes, path logic and tactile 3D interaction.",
              "3D browser platform game about collecting good habits, removing bad habits and navigating moving floating-island obstacles.",
              "Mobile browser 3D space shooter using phone tilt and gyroscope steering to dodge hazards, shoot targets and collect rings.",
              "Thirty-level mouse-and-cheese maze puzzle with one valid path per level and touch or drag controls.",
              "Early-access educational browser game built around programming and simulating robot behavior.",
              "Browser-based 3D construction sandbox for placing and editing digital bricks, saving builds, exporting GLB models and exploring creations through WebXR.",
              "Spatial falling-block puzzle for mobile and Meta Quest browsers that places the game board into the player's environment through WebXR.",
              "Browser game built around a mouse, cheese, a cat and a child in a compact chase-and-collection scenario.",
              "Browser platform game centered on movement, jumping, obstacles, enemies and level progression.",
              "Browser action game that uses webcam hand tracking as the control surface for flying and steering a virtual drone.",
              "3D color-sorting logic puzzle about moving balls between tubes under constrained placement rules.",
              "Client-to-server connection puzzle about constructing valid network routes through a constrained grid.",
              "Independent educational browser game inspired by GibberLink-style machine communication, presented as an interactive learning challenge; not an official GibberLink project.",
              "Simple browser coloring game designed for children with touch-friendly drawing interaction.",
              "Tactile 3D browser adaptation of the classic Hua Rong Dao sliding-block puzzle focused on constrained movement and spatial planning.",
              "Unofficial Mario-themed browser merge puzzle using physics-driven object combinations; not an official Nintendo or Mario product.",
              "Browser platform game centered on compact movement, jumping and touch-friendly arcade controls.",
              "Minimal cyber-themed path-clearing puzzle built around extracting a valid route through a glowing grid.",
              "Minimalist isometric architectural puzzle game built around spatial routes and geometric progression.",
              "Perspective-shifting puzzle game in which changing viewpoint reveals hidden patterns and routes.",
              "Independent LinkedIn-themed browser snake puzzle and compact arcade experiment; not affiliated with LinkedIn.",
              "Dual-control puzzle in which two linked particles must be guided simultaneously to separate target zones.",
              "Independent browser racing game with a Cybertruck-inspired vehicle in a retro off-road physics format; not an official Tesla product.",
              "Expanding-board reinterpretation of tic-tac-toe that turns the familiar rule set into a larger spatial puzzle.",
              "One-button 3D runner built around jumping, mid-air boosts, shields and escalating arcade speed."
            ]:
              if old in html and old != new_description:
                # Only one replacement will correspond to this row; harmlessly checking all old values keeps the script simple.
                pass
          old_to_new = {
            "Thirty-level WebGL light puzzle about rotating glass lenses, redirecting a beam and aligning reflections to illuminate the target.": updates["Pathway"]["description"],
            "Early-access isometric route puzzle built around compact spatial scenes, path logic and tactile 3D interaction.": updates["DIORAMA"]["description"],
            "3D browser platform game about collecting good habits, removing bad habits and navigating moving floating-island obstacles.": updates["Happy Collector: Good Habits Adventure"]["description"],
            "Mobile browser 3D space shooter using phone tilt and gyroscope steering to dodge hazards, shoot targets and collect rings.": updates["Cosmic Velocity: Gyro Control"]["description"],
            "Thirty-level mouse-and-cheese maze puzzle with one valid path per level and touch or drag controls.": updates["Cheese Maze Mouse"]["description"],
            "Early-access educational browser game built around programming and simulating robot behavior.": updates["RoboSim"]["description"],
            "Browser-based 3D construction sandbox for placing and editing digital bricks, saving builds, exporting GLB models and exploring creations through WebXR.": updates["Legocraft"]["description"],
            "Spatial falling-block puzzle for mobile and Meta Quest browsers that places the game board into the player's environment through WebXR.": updates["AR Tetris"]["description"],
            "Browser game built around a mouse, cheese, a cat and a child in a compact chase-and-collection scenario.": updates["Cheese Heist Mouse"]["description"],
            "Browser platform game centered on movement, jumping, obstacles, enemies and level progression.": updates["In a Stickman's World"]["description"],
            "Browser action game that uses webcam hand tracking as the control surface for flying and steering a virtual drone.": updates["Hand Drone XS"]["description"],
            "3D color-sorting logic puzzle about moving balls between tubes under constrained placement rules.": updates["Ball Sort 3D"]["description"],
            "Client-to-server connection puzzle about constructing valid network routes through a constrained grid.": updates["Routing Protocol"]["description"],
            "Independent educational browser game inspired by GibberLink-style machine communication, presented as an interactive learning challenge; not an official GibberLink project.": updates["GIBBERLINK ACADEMY"]["description"],
            "Simple browser coloring game designed for children with touch-friendly drawing interaction.": updates["Coloring Book For Kids"]["description"],
            "Tactile 3D browser adaptation of the classic Hua Rong Dao sliding-block puzzle focused on constrained movement and spatial planning.": updates["Klotski"]["description"],
            "Unofficial Mario-themed browser merge puzzle using physics-driven object combinations; not an official Nintendo or Mario product.": updates["Mario Merge"]["description"],
            "Browser platform game centered on compact movement, jumping and touch-friendly arcade controls.": updates["Old Bounce"]["description"],
            "Minimal cyber-themed path-clearing puzzle built around extracting a valid route through a glowing grid.": updates["Sector Glow: Cyber-Extract"]["description"],
            "Minimalist isometric architectural puzzle game built around spatial routes and geometric progression.": updates["Ascension"]["description"],
            "Perspective-shifting puzzle game in which changing viewpoint reveals hidden patterns and routes.": updates["Paradigm Shift"]["description"],
            "Independent LinkedIn-themed browser snake puzzle and compact arcade experiment; not affiliated with LinkedIn.": updates["ZIP IT!"]["description"],
            "Dual-control puzzle in which two linked particles must be guided simultaneously to separate target zones.": updates["Quantum Entanglement"]["description"],
            "Independent browser racing game with a Cybertruck-inspired vehicle in a retro off-road physics format; not an official Tesla product.": updates["Cybertruck Madness '98"]["description"],
            "Expanding-board reinterpretation of tic-tac-toe that turns the familiar rule set into a larger spatial puzzle.": updates["Tic Tac Toe Reimagined"]["description"],
            "One-button 3D runner built around jumping, mid-air boosts, shields and escalating arcade speed.": updates["Jumpy Jumperson"]["description"]
          }
          for old, new in old_to_new.items():
            html = html.replace(old, new)
          html_path.write_text(html, encoding="utf-8")

          identity_path = Path("v2/index.html")
          identity = identity_path.read_text(encoding="utf-8")
          identity = identity.replace('"Game design",\n        "Visual communication"', '"Game design",\n        "Browser games",\n        "WebXR games",\n        "Puzzle game design",\n        "Visual communication"')
          identity = identity.replace('<div class="line"><div class="type">Games</div><div><h3>Interactive Experiments</h3><p>Independent browser, puzzle, VR and experimental game projects.</p></div><a class="go" href="https://joenasr.itch.io/" rel="me">Open</a></div>', '<div class="line"><div class="type">Games</div><div><h3>Games</h3><p>Original browser games, puzzle games, WebXR games, educational games, arcade games and 3D interactive game projects.</p></div><a class="go" href="games.html">Open</a></div>')
          identity_path.write_text(identity, encoding="utf-8")

      - name: Remove one time workflow and commit
        run: |
          rm -f .github/workflows/finalize-games-search-once.yml
          git config user.name "Joe Nasr repository maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add v2/games.json v2/games.html v2/games-preview.svg v2/index.html .github/workflows/finalize-games-search-once.yml
          git diff --cached --quiet || git commit -m "Finalize game search signals and identity relationship"
          git push
