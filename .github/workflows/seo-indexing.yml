name: Keep canonical search files aligned

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  align-search-files:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Enhance the regional search profile
        run: python scripts/enhance_search_profile.py

      - name: Align canonical URLs, profile, games, sitemap and robots file
        shell: python
        run: |
          import json
          import re
          from datetime import date
          from pathlib import Path

          site_url = "https://joe-nasr-signals.vercel.app/"
          profile_url = f"{site_url}v2/"
          person_id = f"{profile_url}#joe-nasr"
          games_url = f"{profile_url}games.html"
          legacy_url = "https://joenasriani.github.io/Joe-Nasr-Signals/"
          concept_url = f"{site_url}pre-institutional-human-order.html"
          avatar_url = "https://avatars.githubusercontent.com/u/3828735?v=4"
          google_verification = "UJLtMo0dFrABd5C7IMfCL2FG5oyVVlAwwiCqJ3hLPZg"
          lastmod = date.today().isoformat()

          index = Path("index.html")
          html = index.read_text(encoding="utf-8")
          html = html.replace(legacy_url, site_url)
          html = re.sub(
              r'<link rel="canonical" href="[^"]+"\s*/>',
              f'<link rel="canonical" href="{site_url}" />',
              html,
              count=1,
          )
          html = re.sub(
              r'<link rel="sitemap" type="application/xml" href="[^"]+"\s*/>',
              f'<link rel="sitemap" type="application/xml" href="{site_url}sitemap.xml" />',
              html,
              count=1,
          )
          html = re.sub(
              r'<meta property="og:url" content="[^"]+"\s*/>',
              f'<meta property="og:url" content="{site_url}" />',
              html,
              count=1,
          )

          verification_tag = f'<meta name="google-site-verification" content="{google_verification}" />'
          if 'name="google-site-verification"' in html:
              html = re.sub(
                  r'<meta name="google-site-verification" content="[^"]*"\s*/>',
                  verification_tag,
                  html,
                  count=1,
              )
          else:
              html = html.replace(
                  '  <meta name="theme-color" content="#101317" />',
                  '  <meta name="theme-color" content="#101317" />\n  ' + verification_tag,
                  1,
              )

          html = html.replace(
              '.filter-button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }\n.filter-button:hover { background: var(--acid); color: var(--ink); border-color: var(--ink); }',
              '.filter-button[aria-pressed="true"],\n.filter-button:hover { background: var(--acid); color: var(--ink); border-color: var(--ink); }',
          )
          html = html.replace(
              '.filter-button:hover,\n.filter-button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }',
              '.filter-button[aria-pressed="true"],\n.filter-button:hover { background: var(--acid); color: var(--ink); border-color: var(--ink); }',
          )
          html = html.replace('--signal: #ff4f2e;', '--signal: #d9ff4f;')
          html = html.replace('rgba(255,79,46,.22)', 'rgba(217,255,79,.22)')

          contrast_css = "\n".join([
              '/* High-contrast yellow text on light backgrounds */',
              '.section-label,',
              '.profile-columns span,',
              '.faq-list summary span,',
              '.method-copy li span,',
              '.result-status button,',
              '.record-status[data-status="Legacy"] {',
              '  display: inline-block;',
              '  width: max-content;',
              '  background: var(--ink);',
              '  color: var(--acid);',
              '  padding: 4px 7px;',
              '}',
              '',
              '.label-two,',
              '.open-button:hover,',
              '::selection {',
              '  color: var(--ink);',
              '}',
              '',
          ])
          if '/* High-contrast yellow text on light backgrounds */' not in html:
              html = html.replace('</style>', contrast_css + '\n</style>', 1)
          index.write_text(html, encoding="utf-8")

          profile = Path("v2/index.html")
          profile_html = profile.read_text(encoding="utf-8")

          if 'property="og:image"' not in profile_html:
              profile_html = profile_html.replace(
                  '<meta property="profile:last_name" content="Nasr">',
                  '<meta property="profile:last_name" content="Nasr">\n'
                  f'<meta property="og:image" content="{avatar_url}">',
                  1,
              )
          if 'name="twitter:image"' not in profile_html:
              profile_html = profile_html.replace(
                  '<meta name="twitter:description" content="XR, AI, interactive systems, spatial computing, multimodal interfaces and experimental software.">',
                  '<meta name="twitter:description" content="XR, AI, interactive systems, spatial computing, multimodal interfaces and experimental software.">\n'
                  f'<meta name="twitter:image" content="{avatar_url}">',
                  1,
              )

          if 'href="games.html"' not in profile_html:
              profile_html = profile_html.replace(
                  '<nav><a href="#identity">Identity</a><a href="#work">Work</a><a href="#profiles">Profiles</a></nav>',
                  '<nav><a href="#identity">Identity</a><a href="#work">Work</a><a href="games.html">Games</a><a href="#profiles">Profiles</a></nav>',
                  1,
              )

          schema_match = re.search(
              r'(<script type="application/ld\+json">\s*)(\{.*?\})(\s*</script>)',
              profile_html,
              flags=re.S,
          )
          if not schema_match:
              raise SystemExit("Canonical profile JSON-LD block not found")

          schema = json.loads(schema_match.group(2))
          graph = schema.get("@graph", [])

          # The Games catalog is maintained only on /v2/games.html + /v2/games.json.
          # Remove the older embedded copy so search/AI systems see one game graph.
          graph = [
              node for node in graph
              if not (
                  node.get("@type") == "ItemList"
                  and node.get("@id") == f"{profile_url}#games"
              )
          ]

          for node in graph:
              if node.get("@type") == "Person" and node.get("@id") == person_id:
                  node["image"] = avatar_url
                  subjects = node.setdefault("subjectOf", [])
                  if not any(item.get("url") == games_url for item in subjects if isinstance(item, dict)):
                      subjects.append({
                          "@type": "CollectionPage",
                          "url": games_url,
                          "name": "Joe Nasr Games"
                      })

          schema["@graph"] = graph
          schema_text = json.dumps(schema, ensure_ascii=False, indent=2)
          profile_html = (
              profile_html[:schema_match.start(2)]
              + schema_text
              + profile_html[schema_match.end(2):]
          )
          profile.write_text(profile_html, encoding="utf-8")

          # RoboSim on itch is a public game, while Joenasriani/robosim currently
          # documents a separate RoboWebSim codebase. Do not assert that repository
          # as source or sameAs evidence for the public RoboSim game.
          robosim_same_as = '''            "sameAs": [
              "https://github.com/Joenasriani/robosim"
            ],
'''
          robosim_source_link = '<a href="https://github.com/Joenasriani/robosim">Source</a>'
          for game_file in (Path("v2/games.html"), Path("v2/games.json")):
              game_text = game_file.read_text(encoding="utf-8")
              game_text = game_text.replace(robosim_same_as, "")
              if game_file.name == "games.html":
                  game_text = game_text.replace(robosim_source_link, "")
              game_file.write_text(game_text, encoding="utf-8")

          sitemap = "\n".join([
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">',
              '  <url>',
              f'    <loc>{profile_url}</loc>',
              f'    <lastmod>{lastmod}</lastmod>',
              '    <changefreq>monthly</changefreq>',
              '    <priority>1.0</priority>',
              '  </url>',
              '  <url>',
              f'    <loc>{games_url}</loc>',
              f'    <lastmod>{lastmod}</lastmod>',
              '    <changefreq>monthly</changefreq>',
              '    <priority>0.95</priority>',
              '  </url>',
              '  <url>',
              f'    <loc>{site_url}</loc>',
              f'    <lastmod>{lastmod}</lastmod>',
              '    <changefreq>monthly</changefreq>',
              '    <priority>0.9</priority>',
              '  </url>',
              '  <url>',
              f'    <loc>{concept_url}</loc>',
              '    <lastmod>2026-09-10</lastmod>',
              '    <changefreq>monthly</changefreq>',
              '    <priority>0.8</priority>',
              '  </url>',
              '</urlset>',
              '',
          ])
          Path("sitemap.xml").write_text(sitemap, encoding="utf-8")

          robots = "\n".join([
              'User-agent: *',
              'Allow: /',
              f'Sitemap: {site_url}sitemap.xml',
              '',
          ])
          Path("robots.txt").write_text(robots, encoding="utf-8")
          Path(".nojekyll").touch()

      - name: Commit aligned search files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html v2/index.html v2/games.html v2/games.json sitemap.xml robots.txt .nojekyll
          if git diff --cached --quiet; then
            echo "Search files already aligned."
          else
            git commit -m "Strengthen Vercel search profile"
            git push
          fi