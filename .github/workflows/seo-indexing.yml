name: Keep canonical search files aligned

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  align-search-files:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Enhance the regional search profile
        run: python scripts/enhance_search_profile.py

      - name: Align the Vercel canonical, sitemap and robots file
        shell: python
        run: |
          import re
          from pathlib import Path

          site_url = "https://joe-nasr-signals.vercel.app/"
          legacy_url = "https://joenasriani.github.io/Joe-Nasr-Signals/"

          index = Path("index.html")
          html = index.read_text(encoding="utf-8")
          html = html.replace(legacy_url, site_url)
          html = re.sub(
              r'<link rel="canonical" href="[^"]+"\s*/>',
              f'<link rel="canonical" href="{site_url}" />',
              html,
              count=1,
          )
          html = re.sub(
              r'<link rel="sitemap" type="application/xml" href="[^"]+"\s*/>',
              f'<link rel="sitemap" type="application/xml" href="{site_url}sitemap.xml" />',
              html,
              count=1,
          )
          html = re.sub(
              r'<meta property="og:url" content="[^"]+"\s*/>',
              f'<meta property="og:url" content="{site_url}" />',
              html,
              count=1,
          )
          index.write_text(html, encoding="utf-8")

          sitemap = "\n".join([
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">',
              '  <url>',
              f'    <loc>{site_url}</loc>',
              '    <lastmod>2026-08-05</lastmod>',
              '    <changefreq>monthly</changefreq>',
              '    <priority>1.0</priority>',
              '  </url>',
              '</urlset>',
              '',
          ])
          Path("sitemap.xml").write_text(sitemap, encoding="utf-8")

          robots = "\n".join([
              'User-agent: *',
              'Allow: /',
              f'Sitemap: {site_url}sitemap.xml',
              '',
          ])
          Path("robots.txt").write_text(robots, encoding="utf-8")
          Path(".nojekyll").touch()

      - name: Commit aligned search files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sitemap.xml robots.txt .nojekyll
          if git diff --cached --quiet; then
            echo "Search files already aligned."
          else
            git commit -m "Strengthen Vercel search profile"
            git push
          fi
