name: Prepare site for search indexing

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize-search:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add canonical metadata and sitemap
        shell: python
        run: |
          from pathlib import Path

          site_url = "https://joenasriani.github.io/Joe-Nasr-Signals/"
          index = Path("index.html")
          html = index.read_text(encoding="utf-8")

          old_head = '''  <meta name="description" content="Joe Nasr public portfolio archive: creative direction, music, education, XR, games and technology ventures." />
          <meta name="theme-color" content="#101317" />
          <title>Joe Nasr — Public Signals</title>'''

          new_head = '''  <meta name="description" content="Official public portfolio archive of Joe Ribal Nasr: creative director, composer, digital experience creator, media educator, XR and game designer, and RoboMarket founder." />
          <meta name="author" content="Joe Ribal Nasr" />
          <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
          <meta name="theme-color" content="#101317" />

          <link rel="canonical" href="https://joenasriani.github.io/Joe-Nasr-Signals/" />
          <link rel="sitemap" type="application/xml" href="https://joenasriani.github.io/Joe-Nasr-Signals/sitemap.xml" />

          <meta property="og:type" content="profile" />
          <meta property="og:site_name" content="Joe Nasr — Public Signals" />
          <meta property="og:title" content="Joe Nasr — Creative Director, Composer &amp; Digital Experience Creator" />
          <meta property="og:description" content="A verified public archive of Joe Nasr’s creative direction, music, education, XR, games and technology work." />
          <meta property="og:url" content="https://joenasriani.github.io/Joe-Nasr-Signals/" />
          <meta property="profile:first_name" content="Joe" />
          <meta property="profile:last_name" content="Nasr" />

          <meta name="twitter:card" content="summary" />
          <meta name="twitter:title" content="Joe Nasr — Creative Director, Composer &amp; Digital Experience Creator" />
          <meta name="twitter:description" content="A verified public archive of Joe Nasr’s creative direction, music, education, XR, games and technology work." />

          <title>Joe Nasr — Creative Director, Composer &amp; Digital Experience Creator</title>'''

          if 'rel="canonical"' not in html:
              if old_head not in html:
                  raise SystemExit("Expected original head block was not found")
              html = html.replace(old_head, new_head, 1)

          html = html.replace(
              '"url": "https://about.me/joenasr",',
              '"url": "https://joenasriani.github.io/Joe-Nasr-Signals/",\n    "description": "Creative director, composer, digital experience creator, media educator, XR and game designer, and founder of RoboMarket.",',
              1,
          )

          index.write_text(html, encoding="utf-8")

          Path("sitemap.xml").write_text(
              '''<?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url>
              <loc>https://joenasriani.github.io/Joe-Nasr-Signals/</loc>
              <lastmod>2026-08-05</lastmod>
              <changefreq>monthly</changefreq>
              <priority>1.0</priority>
            </url>
          </urlset>
          ''',
              encoding="utf-8",
          )

          Path(".nojekyll").touch()

      - name: Commit generated search files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sitemap.xml .nojekyll
          if git diff --cached --quiet; then
            echo "No search-indexing changes were needed."
          else
            git commit -m "Optimize site for Google indexing"
            git push
          fi
