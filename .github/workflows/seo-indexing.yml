name: Validate canonical Signals records

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-records:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check LinkedIn summaries and visible FAQ schema
        run: python scripts/sync_linkedin_records.py --check
      - name: Validate published structured data and category records
        run: python scripts/validate_signals.py
      - name: Validate direct discovery and public evidence boundaries
        run: python scripts/validate_public_graph.py
      - name: Check legacy URL compatibility
        run: python scripts/sync_v2_compatibility.py --check
      - name: Validate credential archive against public HTML and schema
        run: python scripts/validate_credentials.py
      - name: Validate canonical games routes
        run: python scripts/validate_v2_migration.py
      - name: Test migration failure cases and publication gate
        run: python -m unittest discover -s tests -v
