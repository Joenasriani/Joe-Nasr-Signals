name: Canonical games graph alignment

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/a3-games-graph-once.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align games graph
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          p = Path('v2/index.html')
          s = p.read_text(encoding='utf-8')
          pat = re.compile(r'<script type="application/ld\+json">\s*(\{.*?\})\s*</script>', re.S)
          m = pat.search(s)
          if not m:
              raise SystemExit('Canonical JSON-LD block not found')
          data = json.loads(m.group(1))
          graph = data.get('@graph', [])
          graph = [node for node in graph if node.get('@id') != 'https://joe-nasr-signals.vercel.app/v2/#games']
          person = 'https://joe-nasr-signals.vercel.app/v2/#joe-nasr'
          games = [
            ('Pathway', 'https://joenasr.itch.io/pathway', ['https://github.com/Joenasriani/pathway-game']),
            ('DIORAMA', 'https://joenasr.itch.io/diorama', ['https://github.com/Joenasriani/diorama-game']),
            ('Happy Collector: Good Habits Adventure', 'https://joenasr.itch.io/happy-collector', ['https://github.com/Joenasriani/kids-happy-collector']),
            ('Cosmic Velocity', 'https://joenasr.itch.io/cosmic-velocity', []),
            ('Cheese Maze Mouse', 'https://joenasr.itch.io/cheese-maze-mouse', []),
            ('RoboSim', 'https://joenasr.itch.io/robosim', ['https://github.com/Joenasriani/robosim']),
            ('Legocraft / Brick XR Builder', 'https://legocraftvr.vercel.app/', ['https://joenasr.itch.io/brickxr','https://github.com/Joenasriani/legocraft']),
            ('AR Tetris', 'https://joenasr.itch.io/artetris', ['https://github.com/Joenasriani/ar-tetris-mobile']),
            ('Cheese Heist Mouse', 'https://joenasr.itch.io/cheese-heist', []),
            ("In a Stickman's World", 'https://joenasr.itch.io/in-a-stickmans-world', ['https://github.com/Joenasriani/stickman']),
            ('Hand Drone XS', 'https://joenasr.itch.io/hand-drone-xs', ['https://github.com/Joenasriani/hand-drone-game']),
            ('Sorting Balls 3D / Ball Sort 3D', 'https://joenasr.itch.io/sorting-balls-3d', ['https://joenasr.itch.io/ball-sort-3d','https://github.com/Joenasriani/ball-sorting-puzzle']),
            ('Routing Protocol', 'https://joenasr.itch.io/routing-protocol', ['https://github.com/Joenasriani/routing-protocol-game']),
            ('Gibberlink Academy', 'https://joenasr.itch.io/gibberlink-academy', []),
            ('Coloring Book for Kids', 'https://github.com/Joenasriani/coloring-book', []),
            ('Klotski', 'https://joenasr.itch.io/klotski', ['https://github.com/Joenasriani/klotski-game']),
            ('Mario Merge', 'https://joenasr.itch.io/mario-merge', ['https://github.com/Joenasriani/mario-merge']),
            ('Old Bounce', 'https://joenasr.itch.io/bounce', ['https://github.com/Joenasriani/bounce-game']),
            ('Sector Glow: Cyber-Extract', 'https://joenasr.itch.io/sector-glow', []),
            ('Ascension', 'https://joenasr.itch.io/ascension', ['https://github.com/Joenasriani/ascension-opt']),
            ('Paradigm Shift', 'https://joenasr.itch.io/paradigm-shift', ['https://github.com/Joenasriani/paradigm-shift-game']),
            ('ZIP IT!', 'https://joenasr.itch.io/zip-it', ['https://github.com/Joenasriani/zipit-game']),
            ('Quantum Entanglement', 'https://joenasr.itch.io/quantum-entanglement', ['https://github.com/Joenasriani/quantum-entanglement-game']),
            ("Cybertruck Madness '98", 'https://joenasr.itch.io/cybertruck-madness', ['https://github.com/Joenasriani/teslamadness']),
            ('Tic Tac Toe Reimagined', 'https://joenasr.itch.io/tic-tac-toe-reimagined', ['https://github.com/Joenasriani/tictactoe-advanced']),
            ('Jumpy Jumperson', 'https://github.com/Joenasriani/jumpy-jumperson', [])
          ]
          items = []
          for pos, (name, url, same_as) in enumerate(games, 1):
              game = {
                  '@type': 'VideoGame',
                  '@id': url.rstrip('/') + '#game',
                  'name': name,
                  'url': url,
                  'creator': {'@id': person},
                  'gamePlatform': 'Web browser'
              }
              if same_as:
                  game['sameAs'] = same_as
              items.append({'@type':'ListItem','position':pos,'item':game})
          graph.append({
              '@type': 'ItemList',
              '@id': 'https://joe-nasr-signals.vercel.app/v2/#games',
              'name': 'Joe Nasr Games',
              'description': 'Public browser, puzzle, XR and experimental games created by Joe Nasr.',
              'numberOfItems': len(items),
              'itemListElement': items
          })
          data['@graph'] = graph
          block = '<script type="application/ld+json">\n' + json.dumps(data, ensure_ascii=False, indent=2) + '\n</script>'
          s = s[:m.start()] + block + s[m.end():]
          p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/a3-games-graph-once.yml
          git config user.name "Joe Nasr repository maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add v2/index.html .github/workflows/a3-games-graph-once.yml
          git diff --cached --quiet || git commit -m "Add canonical structured graph for Joe Nasr games"
          git push
