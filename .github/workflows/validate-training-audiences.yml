name: Validate training audience relationships
on:
  pull_request:
    paths:
      - 'index.html'
      - 'identity.json'
      - 'llms.txt'
      - 'scripts/validate_training_audiences.py'
      - '.github/workflows/validate-training-audiences.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'identity.json'
      - 'llms.txt'
      - 'scripts/validate_training_audiences.py'
permissions:
  contents: read
jobs:
  validate-training:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check training audience and provenance alignment
        run: python scripts/validate_training_audiences.py
