name: Signals reputation cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reputation-root-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finish canonical person alignment
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('''"alternateName": [
          "Joe Nasr",
          "Joseph Nasr"
        ]''','''"alternateName": [
          "Joe Nasr",
          "Joe Ribal Nasr",
          "Joseph Ribal Nasr"
        ]''')
          # The archive references the canonical person page rather than becoming another canonical person URL.
          person_marker='"@id": "https://joe-nasr-signals.vercel.app/v2/#joe-nasr"'
          start=s.find(person_marker)
          if start!=-1:
              tail=s[start:]
              tail=tail.replace('"url": "https://joe-nasr-signals.vercel.app/"','"url": "https://joe-nasr-signals.vercel.app/v2/"',1)
              old='''"jobTitle": [
          "Creative Director",
          "Composer",
          "Musician",
          "Digital Experience Creator",
          "Media Educator",
          "XR and Game Designer"
        ]'''
              new='''"jobTitle": [
          "Creative Technologist",
          "Creative Director",
          "Educator",
          "Composer"
        ]'''
              tail=tail.replace(old,new,1)
              s=s[:start]+tail
          p.write_text(s)

          # Keep the source generator aligned so future runs do not reintroduce old positioning.
          g=Path('scripts/enhance_search_profile.py').read_text()
          g=g.replace('Lebanese musician, composer and Middle East creative director','creative technologist working across XR, AI and interactive systems')
          g=g.replace('Lebanese Musician, Composer & Middle East Creative Director','Creative Technologist | XR, AI & Interactive Systems')
          g=g.replace('Lebanese musician.<br />Middle East creative director.','Creative technologist.<br />One public record.')
          g=g.replace('Lebanese Musician · Composer · Middle East Creative Director · AI/XR Creator','Creative Technologist · XR · AI · Interactive Systems')
          Path('scripts/enhance_search_profile.py').write_text(g)
          PY
      - name: Commit changes
        run: |
          git config user.name "Joe Nasr Reputation Maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add index.html scripts/enhance_search_profile.py
          git diff --cached --quiet || git commit -m "Finish canonical person alignment in public archive"
          git push
