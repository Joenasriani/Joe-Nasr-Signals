name: Align AR Tetris canonical play URL

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-artetris-canonical-once.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Use the official play URL exposed by the game page
        run: |
          python - <<'PY'
          from pathlib import Path
          old = 'https://joenasriani.github.io/ar-tetris-mobile/'
          new = 'https://artetris.vercel.app/'
          for name in ['v2/games.html', 'v2/games.json']:
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'Expected AR Tetris URL missing in {name}')
              p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Remove workflow and commit
        run: |
          rm -f .github/workflows/fix-artetris-canonical-once.yml
          git config user.name "Joe Nasr repository maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add v2/games.html v2/games.json .github/workflows/fix-artetris-canonical-once.yml
          git diff --cached --quiet || git commit -m "Use canonical AR Tetris play URL"
          git push
