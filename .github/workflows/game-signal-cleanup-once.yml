name: Game signal cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/game-signal-cleanup-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean public game and identity signals
        shell: python
        run: |
          import json
          import re
          from pathlib import Path

          profile = Path('v2/index.html')
          s = profile.read_text(encoding='utf-8')
          replacements = {
            'Canonical identity page for Joe Ribal Nasr, a Lebanese creative technologist working across XR, AI, interactive systems, spatial computing, multimodal interfaces and experimental software.': 'Joe Nasr is a creative technologist working across XR, AI, interactive systems, spatial computing, multimodal interfaces, games and experimental software.',
            '<meta name="author" content="Joe Ribal Nasr">': '<meta name="author" content="Joe Nasr">',
            'Canonical public identity for Joe Ribal Nasr across XR, AI, interactive systems, spatial computing, research and experimental software.': 'Creative technology across XR, AI, interactive systems, spatial computing, games and experimental software.',
            'XR, AI, interactive systems, spatial computing, multimodal interfaces and experimental software.': 'XR, AI, interactive systems, spatial computing, games and experimental software.',
            'CANONICAL PUBLIC IDENTITY': 'XR · AI · INTERACTIVE SYSTEMS',
            'Joe Ribal Nasr · Joseph Ribal Nasr · Dubai / Lebanon': 'Creative Technologist · Dubai / Lebanon',
            'ONE PERSON.<br>ONE CORE IDENTITY.': 'TECHNICAL<br>PRACTICE.',
            "This page is the canonical public identity record connecting Joe Nasr's technical work, research, portfolio, career history, teaching, music and projects without treating each practice as a separate primary profession.": "Joe Nasr builds and researches interactive systems across spatial computing, multimodal interfaces, simulation, games and experimental software.",
            '<div class="identity-note"><strong>Disambiguation.</strong> Joe Nasr, Joe Ribal Nasr and Joseph Ribal Nasr on the linked profiles refer to the Lebanese creative technologist associated with the Joenasriani GitHub account, Joe Nasr Research Registry and QuestRequestVR. Creative direction, visual communication, education and music are part of his professional history and practice, not competing canonical identities.</div>': '<div class="identity-note"><strong>Current work.</strong> Research, games, prototypes and professional work are published as distinct projects and connected here through their original public sources.</div>',
            'IDENTITY<br>PROFILES.': 'PUBLIC<br>PROFILES.',
            'External profiles used to corroborate the same person. Company and product sites are intentionally not used as Person <code>sameAs</code> identities.': 'Public profiles for code, professional work, video, music and project discovery.',
            'Joe Nasr · Canonical public identity': 'Joe Nasr · Creative Technologist'
          }
          for old, new in replacements.items():
            s = s.replace(old, new)
          if 'og:image:alt' not in s:
            s = s.replace('<meta property="og:image" content="https://avatars.githubusercontent.com/u/3828735?v=4">', '<meta property="og:image" content="https://avatars.githubusercontent.com/u/3828735?v=4">\n<meta property="og:image:alt" content="Joe Nasr">')
          if 'twitter:image:alt' not in s:
            s = s.replace('<meta name="twitter:image" content="https://avatars.githubusercontent.com/u/3828735?v=4">', '<meta name="twitter:image" content="https://avatars.githubusercontent.com/u/3828735?v=4">\n<meta name="twitter:image:alt" content="Joe Nasr">')
          s = s.replace('"name": "Joe Nasr — Canonical Identity"', '"name": "Joe Nasr"')
          profile.write_text(s, encoding='utf-8')

          games = Path('v2/games.html')
          g = games.read_text(encoding='utf-8')
          g = g.replace('Games / 26 current published lineages', 'Games / 26 published titles')
          g = g.replace('26 current published game lineages. Public prototypes and development records are indexed separately.', '26 published games. Prototypes and earlier builds are indexed separately.')
          g = g.replace('Creator provenance resolves to one canonical Person entity across GitHub, portfolio, research and public work records.', 'Creative technologist working across browser games, WebXR, interactive systems and experimental software.')
          g = g.replace('>Canonical identity</a>', '>About Joe Nasr</a>')
          g = g.replace('CANONICAL WORK INDEX', 'GAMES / INTERACTIVE SYSTEMS')
          games.write_text(g, encoding='utf-8')

          games_json = Path('v2/games.json')
          data = json.loads(games_json.read_text(encoding='utf-8'))
          for node in data.get('@graph', []):
            if node.get('@type') == 'ItemList':
              node['name'] = 'Games by Joe Nasr'
              node['description'] = 'Original browser, puzzle, arcade, educational, mobile and WebXR games created by Joe Nasr.'
          games_json.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          dev = Path('v2/games-development.html')
          d = dev.read_text(encoding='utf-8')
          d = d.replace('<title>Joe Nasr Game Development Archive | Public Prototypes and Builds</title>', '<title>Game Development Archive | Prototypes and Earlier Builds by Joe Nasr</title>')
          d = d.replace('<meta property="og:title" content="Joe Nasr Game Development Archive">', '<meta property="og:title" content="Game Development Archive by Joe Nasr">')
          d = d.replace('<meta name="twitter:title" content="Joe Nasr Game Development Archive">', '<meta name="twitter:title" content="Game Development Archive by Joe Nasr">')
          d = d.replace('CANONICAL WORK INDEX', 'GAME DEVELOPMENT')
          d = d.replace('This page prevents prototype repositories, alternate builds and historical names from being mistaken for separate current products. Each record is centered on the game itself; Joe Nasr is attached as creator provenance through the canonical Person identity.', 'Earlier builds, prototypes and historical names are separated from current releases so each game stays clear and searchable.')
          d = d.replace('"name":"Joe Nasr Game Development Archive"', '"name":"Game Development Archive by Joe Nasr"')
          d = d.replace('"about":{"@id":"https://joe-nasr-signals.vercel.app/v2/#joe-nasr"},', '"about":{"@type":"Thing","name":"Video games"},\n  "author":{"@id":"https://joe-nasr-signals.vercel.app/v2/#joe-nasr"},')
          dev.write_text(d, encoding='utf-8')

          dev_json = Path('v2/games-development.json')
          dd = json.loads(dev_json.read_text(encoding='utf-8'))
          dd['name'] = 'Public Game Development Archive'
          dd['description'] = 'Public game prototypes, alternate builds and earlier development records, separated from current published releases.'
          dd['author'] = {'@id': 'https://joe-nasr-signals.vercel.app/v2/#joe-nasr'}
          dd['about'] = {'@type': 'Thing', 'name': 'Video games'}
          dev_json.write_text(json.dumps(dd, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          identity = Path('v2/identity.json')
          ident = json.loads(identity.read_text(encoding='utf-8'))
          cw = ident.get('creative_work', {})
          if 'public_game_lineages' in cw:
            cw['published_games'] = cw.pop('public_game_lineages')
          cw['public_development_records'] = 20
          cw['topic_rule'] = 'Each game is represented as its own VideoGame entity. Joe Nasr is linked as creator, while the game remains the primary topic.'
          ident['creative_work'] = cw
          identity.write_text(json.dumps(ident, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          svg = '''<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
          <title id="title">Joe Nasr Games</title>
          <desc id="desc">Preview image for Joe Nasr's published browser, puzzle, arcade, educational and WebXR games.</desc>
          <rect width="1200" height="630" fill="#f2efe7"/>
          <rect width="1200" height="14" fill="#d9ff4f"/>
          <rect x="60" y="64" width="1080" height="1" fill="#101317" opacity=".3"/>
          <text x="60" y="118" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="800" letter-spacing="4" fill="#101317">JOE NASR / GAMES</text>
          <text x="60" y="230" font-family="Arial,Helvetica,sans-serif" font-size="92" font-weight="900" letter-spacing="-5" fill="#101317">26 PUBLISHED</text>
          <text x="60" y="318" font-family="Arial,Helvetica,sans-serif" font-size="92" font-weight="900" letter-spacing="-5" fill="#101317">GAMES</text>
          <text x="64" y="374" font-family="Courier New,monospace" font-size="17" font-weight="700" letter-spacing="2" fill="#6c6b66">BROWSER / PUZZLE / WEBXR / ARCADE / EDUCATIONAL / SANDBOX</text>
          <rect x="60" y="414" width="1080" height="1" fill="#101317" opacity=".24"/>
          <text x="60" y="465" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#101317">PATHWAY · DIORAMA · LEGOCRAFT · HAND DRONE XS · ASCENSION · PARADIGM SHIFT</text>
          <text x="60" y="502" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#101317">QUANTUM ENTANGLEMENT · ROBOSIM · AR TETRIS · ROUTING PROTOCOL · KLOTSKI</text>
          <text x="60" y="548" font-family="Courier New,monospace" font-size="15" font-weight="700" fill="#6c6b66">PLAYABLE BUILDS / SOURCE PROVENANCE / MACHINE READABLE GAME DATA</text>
          <rect x="60" y="584" width="1080" height="1" fill="#101317" opacity=".24"/>
          <text x="60" y="612" font-family="Courier New,monospace" font-size="13" font-weight="700" fill="#6c6b66">joe-nasr-signals.vercel.app/v2/games.html</text>
          </svg>'''
          Path('v2/games-preview.svg').write_text(svg, encoding='utf-8')

      - name: Render social preview PNG
        run: |
          python -m pip install --quiet cairosvg
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(url='v2/games-preview.svg', write_to='v2/games-preview.png', output_width=1200, output_height=630)
          PY

      - name: Commit cleanup
        run: |
          rm -f .github/workflows/game-signal-cleanup-once.yml
          git config user.name "Joe Nasr repository maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add v2/index.html v2/identity.json v2/games.html v2/games.json v2/games-development.html v2/games-development.json v2/games-preview.svg v2/games-preview.png .github/workflows/game-signal-cleanup-once.yml
          git diff --cached --quiet || git commit -m "Center search signals on games and clean public identity presentation"
          git push
